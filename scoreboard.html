<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Score Tracker</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;700;800&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:   #FFD000;
      --gold-dk:#C8940A;
      --red:    #CC2836;
      --teal:   #00B4C8;
      --cyan:   #48D9E8;
      --blue:   #1A6FD4;
      --navy:   #0B2241;
      --white:  #FFFFFF;
      --panel:  rgba(255,255,255,0.92);
    }

    body {
      font-family: 'Nunito', -apple-system, sans-serif;
      min-height: 100vh;
      padding: 16px 14px 32px;
      background: linear-gradient(135deg,
        #00c8d7 0%, #48d9e8 12%, #1a6fd4 28%,
        #00b87a 42%, #f072b6 56%, #48d9e8 70%,
        #00c8d7 84%, #1a6fd4 100%);
      background-size: 400% 400%;
      animation: holo 10s ease infinite;
    }

    @keyframes holo {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ── Title ── */
    h1 {
      font-family: 'Fredoka One', cursive;
      text-align: center;
      font-size: 2rem;
      margin-bottom: 18px;
      color: var(--gold);
      text-shadow:
        -2px -2px 0 var(--red),
         2px -2px 0 var(--red),
        -2px  2px 0 var(--red),
         2px  2px 0 var(--red),
         0    4px 0 var(--navy);
      letter-spacing: 1px;
    }

    /* ── Panels ── */
    .panel {
      background: var(--panel);
      border: 3px solid var(--navy);
      border-radius: 14px;
      box-shadow: 0 3px 0 var(--navy), 4px 6px 16px rgba(0,0,0,0.25);
    }

    /* ── Setup screen ── */
    #setup-screen { display: flex; flex-direction: column; gap: 12px; }

    #setup-card {
      padding: 18px;
    }

    #setup-card h2 {
      font-family: 'Fredoka One', cursive;
      color: var(--navy);
      font-size: 1.2rem;
      text-align: center;
      margin-bottom: 14px;
      letter-spacing: 0.5px;
    }

    #player-list { display: flex; flex-direction: column; gap: 8px; }

    .player-entry {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .player-entry input {
      flex: 1;
      padding: 11px 14px;
      border-radius: 10px;
      border: 2.5px solid var(--teal);
      background: white;
      color: var(--navy);
      font-size: 1rem;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
    }

    .player-entry input:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(72,217,232,0.4);
    }

    .btn-remove {
      background: var(--red);
      border: 2px solid var(--navy);
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      font-weight: 800;
      flex-shrink: 0;
      box-shadow: 0 2px 0 var(--navy);
    }

    /* ── Buttons ── */
    .btn {
      padding: 13px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      width: 100%;
      font-family: 'Nunito', sans-serif;
      letter-spacing: 0.3px;
      transition: transform 0.08s, box-shadow 0.08s;
    }

    .btn:active { transform: translateY(2px); box-shadow: none !important; }

    .btn-add {
      background: white;
      color: var(--teal);
      border: 2.5px dashed var(--teal);
    }

    .btn-start {
      background: var(--gold);
      color: var(--navy);
      border: 3px solid var(--navy);
      box-shadow: 0 4px 0 var(--navy);
      font-size: 1.15rem;
      font-family: 'Fredoka One', cursive;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    .btn-start:disabled { opacity: 0.4; cursor: default; }

    .btn-submit {
      background: var(--teal);
      color: white;
      border: 3px solid var(--navy);
      box-shadow: 0 4px 0 var(--navy);
      font-family: 'Fredoka One', cursive;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      margin-top: 10px;
    }

    .btn-reset {
      background: var(--red);
      color: white;
      border: 3px solid var(--navy);
      box-shadow: 0 3px 0 var(--navy);
      flex: 1;
      font-family: 'Fredoka One', cursive;
      letter-spacing: 0.5px;
    }

    .btn-undo {
      background: white;
      color: var(--navy);
      border: 3px solid var(--navy);
      box-shadow: 0 3px 0 var(--navy);
      flex: 1;
      font-family: 'Fredoka One', cursive;
      letter-spacing: 0.5px;
    }

    .btn-undo:disabled { opacity: 0.35; cursor: default; box-shadow: none; }

    /* ── Game screen ── */
    #game-screen { display: none; flex-direction: column; gap: 14px; }

    /* scoreboard */
    #scoreboard { display: flex; flex-direction: column; gap: 8px; }

    .score-row {
      display: flex;
      align-items: center;
      background: var(--panel);
      border: 3px solid var(--navy);
      border-radius: 12px;
      padding: 11px 14px;
      gap: 10px;
      box-shadow: 0 3px 0 var(--navy);
    }

    .score-row.leader {
      border-color: var(--gold-dk);
      background: #fffbe6;
      box-shadow: 0 3px 0 var(--gold-dk);
    }

    .score-row.winner-row {
      border-color: var(--red);
      background: #fff0f0;
      box-shadow: 0 3px 0 var(--red);
      animation: pulse-winner 1s ease infinite alternate;
    }

    @keyframes pulse-winner {
      from { box-shadow: 0 3px 0 var(--red), 0 0 0 rgba(204,40,54,0); }
      to   { box-shadow: 0 3px 0 var(--red), 0 0 14px rgba(204,40,54,0.45); }
    }

    .rank-badge {
      font-family: 'Fredoka One', cursive;
      font-size: 0.85rem;
      color: white;
      background: var(--teal);
      border: 2px solid var(--navy);
      border-radius: 20px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .rank-badge.rank-1 { background: var(--gold); color: var(--navy); }
    .rank-badge.rank-2 { background: #b0b8c8; }
    .rank-badge.rank-3 { background: #c87941; }

    .player-name {
      flex: 1;
      font-size: 1rem;
      font-weight: 800;
      color: var(--navy);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .total-score {
      font-family: 'Fredoka One', cursive;
      font-size: 1.5rem;
      color: var(--blue);
      min-width: 52px;
      text-align: right;
    }

    .score-row.leader .total-score { color: var(--gold-dk); }
    .score-row.winner-row .total-score { color: var(--red); }

    /* progress bar */
    .progress-wrap {
      width: 100%;
      height: 6px;
      background: #d8ecf0;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--teal), var(--blue));
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    .score-row.leader .progress-bar { background: linear-gradient(90deg, var(--gold), var(--gold-dk)); }
    .score-row.winner-row .progress-bar { background: linear-gradient(90deg, var(--red), #8b0000); }

    .score-col { display: flex; flex-direction: column; align-items: flex-end; min-width: 52px; }

    /* winner overlay */
    #winner-banner {
      display: none;
      background: var(--gold);
      border: 4px solid var(--navy);
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 5px 0 var(--navy);
      animation: pop-in 0.35s cubic-bezier(0.34,1.56,0.64,1);
    }

    @keyframes pop-in {
      from { transform: scale(0.5); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    #winner-banner .winner-title {
      font-family: 'Fredoka One', cursive;
      font-size: 1.1rem;
      color: var(--red);
      text-shadow: 1px 1px 0 var(--navy);
      letter-spacing: 1px;
    }

    #winner-banner .winner-name {
      font-family: 'Fredoka One', cursive;
      font-size: 2rem;
      color: var(--navy);
      line-height: 1.1;
      margin: 4px 0;
    }

    #winner-banner .winner-score {
      font-family: 'Fredoka One', cursive;
      font-size: 1.2rem;
      color: var(--red);
    }

    /* round entry */
    #round-section { padding: 16px; }

    #round-section h2 {
      font-family: 'Fredoka One', cursive;
      font-size: 1.1rem;
      color: var(--navy);
      margin-bottom: 12px;
      text-align: center;
    }

    #round-inputs { display: flex; flex-direction: column; gap: 10px; }

    .round-input-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .round-label {
      flex: 1;
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--navy);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .round-input-row input {
      width: 90px;
      padding: 10px;
      border-radius: 10px;
      border: 2.5px solid var(--teal);
      background: white;
      color: var(--navy);
      font-family: 'Fredoka One', cursive;
      font-size: 1.2rem;
      text-align: center;
    }

    .round-input-row input:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(72,217,232,0.4);
    }

    /* history */
    #history-section { padding: 10px 14px 14px; }

    #history-section summary {
      cursor: pointer;
      color: var(--navy);
      font-size: 0.9rem;
      font-weight: 800;
      padding: 4px 0;
      user-select: none;
    }

    #history-table-wrap { overflow-x: auto; margin-top: 10px; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    th, td {
      padding: 6px 10px;
      border-bottom: 1px solid #d0e8ec;
      text-align: center;
      color: var(--navy);
    }

    th {
      font-family: 'Fredoka One', cursive;
      color: var(--teal);
      border-bottom: 2px solid var(--teal);
    }

    td:first-child, th:first-child { text-align: left; color: #777; }

    /* action bar */
    #action-bar { display: flex; gap: 10px; }
  </style>
</head>
<body>

<h1>RACE TO 200!</h1>

<!-- SETUP -->
<div id="setup-screen">
  <div class="panel" id="setup-card">
    <h2>Enter Players</h2>
    <div id="player-list">
      <div class="player-entry">
        <input type="text" placeholder="Player 1" maxlength="20" autofocus>
        <button class="btn-remove" onclick="removePlayer(this)">✕</button>
      </div>
      <div class="player-entry">
        <input type="text" placeholder="Player 2" maxlength="20">
        <button class="btn-remove" onclick="removePlayer(this)">✕</button>
      </div>
    </div>
    <br>
    <button class="btn btn-add" onclick="addPlayerField()">+ Add Player</button>
  </div>
  <button class="btn btn-start" id="btn-start" onclick="startGame()">START GAME</button>
</div>

<!-- GAME -->
<div id="game-screen">

  <div id="winner-banner">
    <div class="winner-title">🎉 WINNER! 🎉</div>
    <div class="winner-name" id="winner-name"></div>
    <div class="winner-score" id="winner-score"></div>
  </div>

  <div id="scoreboard"></div>

  <div class="panel" id="round-section">
    <h2 id="round-label">Round 1</h2>
    <div id="round-inputs"></div>
    <button class="btn btn-submit" onclick="submitRound()">Add Round Scores</button>
  </div>

  <details class="panel" id="history-section">
    <summary>▸ Round History</summary>
    <div id="history-table-wrap"><table id="history-table"></table></div>
  </details>

  <div id="action-bar">
    <button class="btn btn-undo" id="btn-undo" onclick="undoRound()">↩ Undo</button>
    <button class="btn btn-reset" onclick="resetGame()">New Game</button>
  </div>
</div>

<script>
  const WIN_SCORE = 200;

  let players = [];   // [{name, total}]
  let history = [];   // [{scores:[...]}]
  let gameWon = false;

  /* ── Setup ── */

  function addPlayerField() {
    const list = document.getElementById('player-list');
    const n = list.children.length + 1;
    const div = document.createElement('div');
    div.className = 'player-entry';
    div.innerHTML = `<input type="text" placeholder="Player ${n}" maxlength="20">
                     <button class="btn-remove" onclick="removePlayer(this)">✕</button>`;
    list.appendChild(div);
    div.querySelector('input').focus();
  }

  function removePlayer(btn) {
    const list = document.getElementById('player-list');
    if (list.children.length <= 1) return;
    btn.parentElement.remove();
  }

  function startGame() {
    const inputs = document.querySelectorAll('#player-list .player-entry input');
    const names = [...inputs].map(i => i.value.trim()).filter(Boolean);
    if (names.length < 1) return;

    players = names.map(name => ({ name, total: 0 }));
    history = [];
    gameWon = false;

    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'flex';
    document.getElementById('winner-banner').style.display = 'none';

    renderScoreboard();
    renderRoundInputs();
    renderHistory();
    updateUndoBtn();
  }

  /* ── Game ── */

  function renderScoreboard() {
    const board = document.getElementById('scoreboard');
    const sorted = [...players]
      .map((p, i) => ({ ...p, origIdx: i }))
      .sort((a, b) => b.total - a.total);

    board.innerHTML = sorted.map((p, rank) => {
      const isWinner = p.total >= WIN_SCORE;
      const isLeader = !isWinner && rank === 0 && players.length > 1 && p.total > 0;
      const pct = Math.min(100, Math.round((p.total / WIN_SCORE) * 100));
      const rowClass = isWinner ? ' winner-row' : isLeader ? ' leader' : '';
      const badgeClass = rank === 0 ? ' rank-1' : rank === 1 ? ' rank-2' : rank === 2 ? ' rank-3' : '';

      return `<div class="score-row${rowClass}">
        <div class="rank-badge${badgeClass}">${rank + 1}</div>
        <div style="flex:1;min-width:0">
          <div class="player-name">${isWinner ? '🏆 ' : isLeader ? '👑 ' : ''}${esc(p.name)}</div>
          <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
        </div>
        <div class="score-col">
          <span class="total-score">${p.total}</span>
        </div>
      </div>`;
    }).join('');

    // Show winner banner for the first player to pass 200
    const winner = players.find(p => p.total >= WIN_SCORE);
    const banner = document.getElementById('winner-banner');
    if (winner && !gameWon) {
      gameWon = true;
      document.getElementById('winner-name').textContent = winner.name;
      document.getElementById('winner-score').textContent = `${winner.total} points`;
      banner.style.display = 'block';
      // disable round entry
      document.getElementById('round-section').style.opacity = '0.5';
      document.getElementById('round-section').style.pointerEvents = 'none';
    } else if (!winner) {
      gameWon = false;
      banner.style.display = 'none';
      document.getElementById('round-section').style.opacity = '';
      document.getElementById('round-section').style.pointerEvents = '';
    }
  }

  function renderRoundInputs() {
    const container = document.getElementById('round-inputs');
    document.getElementById('round-label').textContent = `Round ${history.length + 1}`;

    container.innerHTML = players.map((p, i) =>
      `<div class="round-input-row">
        <span class="round-label">${esc(p.name)}</span>
        <input type="number" inputmode="numeric" id="ri-${i}" placeholder="0">
      </div>`
    ).join('');

    const first = document.getElementById('ri-0');
    if (first) first.focus();

    const last = document.getElementById(`ri-${players.length - 1}`);
    if (last) last.addEventListener('keydown', e => { if (e.key === 'Enter') submitRound(); });
  }

  function submitRound() {
    if (gameWon) return;
    const scores = players.map((_, i) => {
      const val = parseFloat(document.getElementById(`ri-${i}`).value);
      return isNaN(val) ? 0 : val;
    });

    history.push({ scores });
    players.forEach((p, i) => p.total += scores[i]);

    renderScoreboard();
    renderRoundInputs();
    renderHistory();
    updateUndoBtn();
  }

  function undoRound() {
    if (!history.length) return;
    const last = history.pop();
    players.forEach((p, i) => p.total -= last.scores[i]);
    gameWon = false;

    renderScoreboard();
    renderRoundInputs();
    renderHistory();
    updateUndoBtn();
  }

  function renderHistory() {
    const table = document.getElementById('history-table');
    if (!history.length) { table.innerHTML = '<tr><td style="color:#aaa">No rounds yet</td></tr>'; return; }

    const header = `<tr><th>Rnd</th>${players.map(p => `<th>${esc(p.name)}</th>`).join('')}</tr>`;
    const rows = history.map((r, idx) =>
      `<tr><td>${idx + 1}</td>${r.scores.map(s => `<td>${s}</td>`).join('')}</tr>`
    ).join('');

    table.innerHTML = header + rows;
  }

  function updateUndoBtn() {
    document.getElementById('btn-undo').disabled = history.length === 0;
  }

  function resetGame() {
    if (!confirm('Start a new game? Current scores will be lost.')) return;
    document.getElementById('game-screen').style.display = 'none';
    document.getElementById('setup-screen').style.display = 'flex';
    const inputs = document.querySelectorAll('#player-list .player-entry input');
    inputs.forEach(i => i.value = '');
    inputs[0].focus();
  }

  function esc(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
</html>
